spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:5}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/v1/**
              metadata:
                connect-timeout: 3000
                response-timeout: 11000
server:
  port: 8080

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  gateway:
    public-routes:
      - /api/auth/v1/**
    service-routes: # Configure downstream service paths here to enable resilience
      auth-service: /api/auth/v1
  resilience: # Default resilience config
    defaults:
      sliding-window-size: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state-seconds: 30
      permitted-calls-in-half-open-state: 3
    # instances: only add here if you need to override defaults for a specific service

logging:
  level:
    root: INFO